services:
  staging-db:
    image: postgres:16-alpine
    container_name: laptoppoint-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laptoppoint_staging
      POSTGRES_PASSWORD: staging_secret_password_123
      POSTGRES_DB: laptoppoint_staging_db
    ports:
      - "55432:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laptoppoint_staging -d laptoppoint_staging_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  staging_pgdata:
